<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OE · Painel de Monitoramento</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --vp:#003D1E; --vg:#00592A; --va:#00843D; --vc:#E8F3EA;
      --fd:#F3F8F4; --am:#F4A900; --amc:#FFF8E1; --br:#FFFFFF;
      --tx:#162318; --ts:#4A6350; --bd:#C8DDD0;
      --fnt-d:'Barlow Condensed',sans-serif;
      --fnt-b:'Inter',sans-serif; --fnt-m:'Roboto Mono',monospace;
      --rad:10px; --sh:0 2px 8px rgba(0,61,30,.08);
    }

    /* ── Modo escuro ── */
    [data-theme="dark"] {
      --fd:#0D1F12; --br:#162A1B; --tx:#DFF0E4; --ts:#7AAE8A;
      --bd:#2A4534; --vc:#1A3322; --amc:#2A2000; --sh:0 2px 8px rgba(0,0,0,.35);
    }
    [data-theme="dark"] body        { background:var(--fd); color:var(--tx); }
    [data-theme="dark"] .rom-card   { background:var(--br); border-color:var(--bd); }
    [data-theme="dark"] .card-top   { background:var(--br); }
    [data-theme="dark"] .card-body  { background:var(--vc); }
    [data-theme="dark"] .dest-row   { color:var(--ts); }
    [data-theme="dark"] .nota-chip  { background:#1A3322; border-color:#2A4534; }
    [data-theme="dark"] .pg-title   { color:#5ABF7B; }
    [data-theme="dark"] .filter-panel { background:var(--br); border-color:var(--bd); }
    [data-theme="dark"] .filter-input { background:#0D1F12; border-color:var(--bd); color:var(--tx); }
    [data-theme="dark"] .filter-input:focus { border-color:var(--va); }
    [data-theme="dark"] .stat-box   { background:var(--br); border-color:var(--bd); }
    [data-theme="dark"] .pg-upd     { color:var(--ts); }

    /* ══ TELA ══ */
    @media screen {
      body { font-family:var(--fnt-b); background:var(--fd); color:var(--tx); min-height:100vh; }

      header {
        background:var(--vp); color:white; height:60px;
        display:flex; align-items:center; padding:0 24px;
        position:sticky; top:0; z-index:100;
        box-shadow:0 2px 12px rgba(0,0,0,.25);
      }
      .h-inner { width:100%; max-width:960px; margin:0 auto; display:flex; align-items:center; gap:16px; }
      .h-logo  { display:flex; align-items:center; gap:12px; flex-shrink:0; }

      .h-company { font-family:var(--fnt-d); font-size:17px; font-weight:600; letter-spacing:.3px; }
      .h-sub     { font-size:10px; color:rgba(255,255,255,.5); letter-spacing:1.2px; text-transform:uppercase; display:block; margin-top:1px; }
      .div-v     { width:1px; height:28px; background:rgba(255,255,255,.15); }
      .live-badge { display:flex; align-items:center; gap:7px; font-size:12px; color:rgba(255,255,255,.75); }
      .pulse-dot { width:8px; height:8px; border-radius:50%; background:#4ADE80; animation:pulse 2s ease infinite; flex-shrink:0; }
      @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.6)} 50%{box-shadow:0 0 0 5px rgba(74,222,128,0)} }
      .h-right { margin-left:auto; }
      .h-clock { font-family:var(--fnt-m); font-size:12px; color:rgba(255,255,255,.6); }

      /* ── Header buttons ── */
      .h-btn {
        background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.2);
        border-radius:7px;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:600;
        display:flex;align-items:center;gap:5px;transition:background .15s;white-space:nowrap;
      }
      .h-btn:hover { background:rgba(255,255,255,.22); }
      .h-btn .badge {
        background:var(--am);color:#000;border-radius:10px;
        font-size:10px;padding:1px 6px;font-weight:700;
      }

      /* ── Stats bar ── */
      .stats-bar {
        display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;
      }
      .stat-box {
        background:var(--br);border:1px solid var(--bd);border-radius:var(--rad);
        padding:12px 18px;flex:1;min-width:120px;box-shadow:var(--sh);
        display:flex;flex-direction:column;gap:2px;
      }
      .stat-val { font-family:var(--fnt-d);font-size:26px;font-weight:700;color:var(--vg); }
      .stat-lbl { font-size:11px;color:var(--ts);text-transform:uppercase;letter-spacing:.5px; }

      /* ── Filter panel ── */
      .filter-panel {
        background:var(--br);border:1px solid var(--bd);border-radius:var(--rad);
        padding:0;margin-bottom:20px;box-shadow:var(--sh);
        overflow:hidden;transition:max-height .3s ease,opacity .3s ease;
        max-height:0;opacity:0;pointer-events:none;
      }
      .filter-panel.open { max-height:300px;opacity:1;pointer-events:all; }
      .filter-inner { padding:16px 20px; }
      .filter-title {
        font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
        color:var(--ts);margin-bottom:12px;display:flex;align-items:center;gap:8px;
      }
      .filter-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px; }
      .filter-field { display:flex;flex-direction:column;gap:5px; }
      .filter-field label { font-size:11px;font-weight:600;color:var(--ts);text-transform:uppercase;letter-spacing:.4px; }
      .filter-input {
        padding:8px 10px;border:1px solid var(--bd);border-radius:7px;
        font-size:13px;font-family:var(--fnt-b);background:var(--fd);color:var(--tx);
        transition:border-color .2s;
      }
      .filter-input:focus { outline:none;border-color:var(--va);box-shadow:0 0 0 3px rgba(0,132,61,.1); }
      .filter-actions { display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd); }
      .filter-count {
        font-size:12px;color:var(--ts);flex:1;
      }
      .btn-clear-filter {
        background:none;border:1px solid var(--bd);border-radius:7px;
        padding:7px 14px;font-size:12px;cursor:pointer;color:var(--ts);
        transition:all .15s;
      }
      .btn-clear-filter:hover { border-color:var(--vg);color:var(--vg); }
      .btn-apply-filter {
        background:var(--vg);color:white;border:none;border-radius:7px;
        padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer;
        transition:background .15s;
      }
      .btn-apply-filter:hover { background:var(--vp); }

      /* ── Active filter chips ── */
      .active-filters { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center; }
      .active-filters:empty { display:none; }
      .filter-chip {
        display:inline-flex;align-items:center;gap:5px;background:var(--vc);
        border:1px solid var(--va);border-radius:20px;padding:3px 10px;font-size:11px;
        font-weight:600;color:var(--vg);
      }
      .filter-chip button {
        background:none;border:none;cursor:pointer;color:var(--ts);font-size:13px;
        padding:0;line-height:1;display:flex;
      }
      .filter-chip button:hover { color:#dc2626; }

      /* TOAST */
      .toast {
        position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-14px);
        background:var(--vp); color:white; padding:12px 22px; border-radius:var(--rad);
        font-size:14px; font-weight:500; box-shadow:0 4px 16px rgba(0,0,0,.25);
        border-left:4px solid var(--am); z-index:200;
        opacity:0; pointer-events:none; white-space:nowrap;
        transition:opacity .3s, transform .3s;
      }
      .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

      /* MAIN */
      main { max-width:960px; margin:0 auto; padding:28px 24px 80px; }
      .pg-hdr { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; gap:16px; }
      .pg-title { font-family:var(--fnt-d); font-size:26px; font-weight:700; color:var(--vg); }
      .pg-sub   { font-size:13px; color:var(--ts); margin-top:3px; }
      .pg-upd   { font-size:12px; color:var(--ts); text-align:right; flex-shrink:0; padding-top:4px; }

      /* EMPTY / LOADING */
      .empty { text-align:center; padding:60px 20px; color:var(--ts); }
      .empty-ico { font-size:40px; margin-bottom:12px; opacity:.4; }
      .empty h3  { font-family:var(--fnt-d); font-size:18px; font-weight:600; margin-bottom:6px; }
      .empty p   { font-size:13px; opacity:.7; }
      .loading   { display:flex; align-items:center; justify-content:center; gap:8px; padding:50px; color:var(--ts); font-size:14px; }
      .spinner   { width:18px; height:18px; border:2px solid var(--bd); border-top-color:var(--va); border-radius:50%; animation:spin .7s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }

      /* ROMANEIO CARD */
      .rom-card {
        background:var(--br); border-radius:var(--rad); border:1px solid var(--bd);
        margin-bottom:16px; box-shadow:var(--sh); overflow:hidden;
        transition:box-shadow .2s;
      }
      .rom-card:hover { box-shadow:0 4px 16px rgba(0,61,30,.13); }
      .rom-card.novo  { border-color:var(--am); box-shadow:0 0 0 3px rgba(244,169,0,.2); animation:cardIn .35s ease; }
      @keyframes cardIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

      .card-top {
        padding:14px 20px; display:flex; align-items:center; gap:12px;
        background:var(--vc); border-bottom:1px solid var(--bd);
        flex-wrap:wrap;
      }
      .num-badge {
        font-family:var(--fnt-d); font-size:22px; font-weight:700; color:var(--vp);
        background:white; border:2px solid var(--bd); border-radius:7px;
        padding:2px 10px; flex-shrink:0; letter-spacing:1px;
      }
      .card-meta { flex:1; min-width:0; }
      .card-info-line { font-size:13px; font-weight:600; color:var(--vp); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
      .card-info-line span { display:flex; align-items:center; gap:5px; }
      .card-datetime { font-family:var(--fnt-m); font-size:11px; color:var(--ts); margin-top:3px; }

      .novo-tag {
        background:var(--am); color:var(--vp); font-family:var(--fnt-d);
        font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
        animation:blink 1.5s ease infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }

      .btn-imp {
        background:var(--vg); color:white; border:none; padding:8px 18px;
        border-radius:8px; font-family:var(--fnt-d); font-size:15px; font-weight:600;
        cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;
        transition:background .15s, transform .1s; flex-shrink:0;
      }
      .btn-imp:hover  { background:var(--vp); }
      .btn-imp:active { transform:scale(.97); }
      .btn-edit { background:#1B5E38 !important; }
      .btn-edit:hover { background:#0f3d22 !important; }

      /* DESTINOS BODY */
      .card-body { padding:14px 20px 16px; }

      .destino-row {
        border:1px solid var(--bd); border-radius:8px; margin-bottom:10px; overflow:hidden;
      }
      .destino-row:last-child { margin-bottom:0; }

      .dest-row-hdr {
        background:var(--vc); padding:7px 12px; display:flex; align-items:center; gap:8px;
        border-bottom:1px solid var(--bd);
      }
      .dest-num-sm {
        width:22px; height:22px; background:var(--vp); color:white;
        font-family:var(--fnt-d); font-size:12px; font-weight:700;
        border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
      }
      .dest-usina-name { font-family:var(--fnt-d); font-size:15px; font-weight:600; color:var(--vp); flex:1; }
      .dest-qtd { font-size:11px; color:var(--ts); font-weight:500; }

      .dest-row-notas { padding:8px 12px; display:flex; flex-wrap:wrap; gap:5px; }

      .nota-chip {
        background:var(--amc); border:1px solid rgba(244,192,48,.5);
        border-left:3px solid var(--am); border-radius:4px; padding:3px 8px;
        font-family:var(--fnt-m); font-size:11px; color:var(--vp);
      }
      .nota-mais { background:var(--vc); color:var(--vg); font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; }

      .card-footer { padding:8px 20px; border-top:1px solid var(--bd); font-size:12px; color:var(--ts); background:#FAFCFA; }

      @media (max-width:600px) {
        .card-top { flex-direction:column; align-items:flex-start; }
        .btn-imp  { width:100%; justify-content:center; }
      }
    }

    /* ══ IMPRESSÃO — 3 VIAS ══ */
    #area-imp { display:none; }

    @media print {
      body > *:not(#area-imp) { display:none !important; }
      #area-imp { display:block !important; }

      .via {
        padding:10mm 16mm 8mm;
        font-family:Arial, Helvetica, sans-serif;
        font-size:9.5pt; color:#000;
        page-break-after:always;
      }
      .via:last-child { page-break-after:avoid; }

      /* cabeçalho */
      .via-hdr { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
      .via-logo { height:52px; width:auto; object-fit:contain; flex-shrink:0; display:block; }
      .via-empresa { flex:1; }
      .via-empresa strong { display:block; font-size:13pt; font-weight:bold; color:#003D1E; }
      .via-empresa span   { font-size:9pt; color:#555; }
      .via-etiqueta {
        border:2.5px solid #003D1E; border-radius:5px;
        padding:4px 10px; text-align:center; flex-shrink:0;
      }
      .via-etiqueta strong { display:block; font-size:12pt; font-weight:900; color:#003D1E; }
      .via-etiqueta em { display:block; font-style:normal; font-size:8pt; font-weight:bold; color:#C97F00; margin-top:1px; letter-spacing:1px; }

      hr.lh { border:none; border-top:2px solid #003D1E; margin:5px 0; }
      hr.ls { border:none; border-top:1px solid #ccc; margin:5px 0; }

      /* dados do embarque */
      .dados-row { display:flex; gap:0; border:1px solid #bbb; border-radius:3px; overflow:hidden; margin-bottom:8px; }
      .dado { flex:1; padding:5px 8px; border-right:1px solid #ddd; }
      .dado:last-child { border-right:none; }
      .dado label { display:block; font-size:7.5pt; font-weight:bold; color:#555; text-transform:uppercase; margin-bottom:1px; }
      .dado span  { font-size:9.5pt; font-weight:bold; color:#000; }
      .dado.w2 { flex:2; }

      /* seção por destino */
      .dest-secao { margin-bottom:6px; }
      .dest-titulo {
        background:#003D1E; color:white; padding:4px 8px;
        font-size:9.5pt; font-weight:bold;
        display:flex; align-items:center; justify-content:space-between;
        border-radius:3px 3px 0 0;
      }
      .dest-titulo em { font-style:normal; font-size:8pt; font-weight:normal; opacity:.8; }

      table.notas {
        width:100%; border-collapse:collapse; font-size:9pt;
        margin-bottom:0;
      }
      table.notas th {
        background:#1B6B3A; color:white; padding:4px 7px;
        text-align:left; font-size:8.5pt; font-weight:bold;
      }
      table.notas td { padding:3px 7px; border-bottom:1px solid #e8e8e8; vertical-align:middle; }
      table.notas tr:nth-child(even) td { background:#f0f7f1; }
      .ch { font-family:'Courier New',monospace; font-size:7pt; color:#333; letter-spacing:.3px; }

      /* rodapé da seção */
      .secao-footer { background:#E8F3EA; font-size:8.5pt; font-weight:bold; padding:3px 8px; border:1px solid #bbb; border-top:none; border-radius:0 0 3px 3px; margin-bottom:6px; }

      /* total geral */
      .total-bloco { background:#003D1E; color:white; padding:5px 10px; border-radius:3px; text-align:center; font-size:10pt; font-weight:bold; margin:6px 0; }

      /* assinaturas */
      /* ── Via Expedição — discriminação de volumes ── */
      .discrim-box {
        border: 2px solid #222;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .discrim-titulo {
        background: #e8e8e8;
        border-bottom: 2px solid #222;
        text-align: center;
        font-weight: bold;
        font-size: 11pt;
        padding: 7px 10px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .discrim-row {
        padding: 10px 14px 6px;
        border-bottom: 1px solid #ccc;
      }
      .discrim-row:last-child { border-bottom: none; }
      .discrim-usina {
        font-weight: bold;
        font-size: 12pt;
        display: block;
        margin-bottom: 6px;
      }
      .discrim-linha {
        display: block;
        border-bottom: 2px solid #444;
        margin-bottom: 8px;
        height: 28px;
      }
      .discrim-linha + .discrim-linha {
        margin-top: 4px;
      }

      /* ── Via Logística — bloco de transporte ── */
      .transp-box {
        border: 2px solid #222;
        border-radius: 4px;
        padding: 0;
        font-size: 9pt;
        margin-top: 4px;
        overflow: hidden;
      }
      .transp-titulo {
        background: #f0f0f0;
        border-bottom: 1px solid #222;
        text-align: center;
        font-weight: bold;
        font-size: 9.5pt;
        padding: 5px 8px;
        line-height: 1.3;
      }
      .transp-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid #bbb;
        font-size: 9pt;
        gap: 20px;
      }
      .transp-sep {
        text-align: center;
        font-size: 8.5pt;
        font-weight: bold;
        border-bottom: 1px solid #bbb;
        padding: 3px 10px;
        background: #fafafa;
        letter-spacing: 1px;
      }
      .transp-campo-linha {
        height: 22px;
        border-bottom: 1px solid #222;
        margin: 4px 10px;
      }
      .transp-ass-label {
        text-align: center;
        font-size: 8pt;
        color: #555;
        padding: 2px 10px 0;
        font-style: italic;
      }
      .transp-ass-space {
        height: 28px;
        border-bottom: 1px solid #222;
        margin: 0 10px 4px;
      }
      .transp-row2 {
        display: flex;
        justify-content: space-between;
        padding: 5px 10px;
        border-bottom: 1px solid #bbb;
        font-size: 8.5pt;
        gap: 10px;
      }
      .transp-modais {
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px;
        font-size: 8.5pt;
        font-weight: bold;
      }

      .assinaturas { display:flex; gap:30px; margin-top:8px; }
      .ass { flex:1; }
      .ass p { font-size:8pt; color:#555; margin-bottom:14px; }
      .ass-linha { height:1px; background:#333; margin-bottom:3px; }
      .ass small { font-size:7.5pt; color:#777; }

      /* rodapé via */
      .via-rodape { margin-top:5px; font-size:7.5pt; color:#999; text-align:center; border-top:1px dashed #ccc; padding-top:4px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>

  let ultimoNum   = null;
  let primeiraVez = true;
  let romaneiosList = []; // lista global para o botão Editar

  // ══════════════════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════════════════
  // ── Estado dos filtros ──────────────────────────────────────
  let filtros = { dataIni:'', dataFim:'', motorista:'', usina:'' };
  let listaCompleta = []; // todos os romaneios sem filtro

  document.addEventListener('DOMContentLoaded', () => {
    atualizarClock();
    setInterval(atualizarClock, 1000);
    buscar();
    setInterval(buscar, 2000);

    // Restaurar tema salvo
    const tema = localStorage.getItem('oe-tema') || 'light';
    document.documentElement.setAttribute('data-theme', tema);
    document.getElementById('btn-tema').textContent = tema === 'dark' ? '☀' : '🌙';

    // Aplicar filtros ao pressionar Enter nos campos
    ['f-data-ini','f-data-fim','f-motorista','f-usina'].forEach(id => {
      document.getElementById(id)?.addEventListener('keydown', e => {
        if (e.key === 'Enter') aplicarFiltros();
      });
    });
  });

  // ── Tema escuro / claro ──────────────────────────────────────
  function toggleDarkMode() {
    const atual = document.documentElement.getAttribute('data-theme');
    const novo  = atual === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', novo);
    localStorage.setItem('oe-tema', novo);
    document.getElementById('btn-tema').textContent = novo === 'dark' ? '☀' : '🌙';
  }

  // ── Tela cheia ───────────────────────────────────────────────
  function toggleFullscreen() {
    const btn = document.getElementById('btn-fs');
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      btn.textContent = '⛶';
      btn.title = 'Sair da tela cheia';
    } else {
      document.exitFullscreen();
      btn.textContent = '⛶';
      btn.title = 'Tela cheia';
    }
  }
  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('btn-fs');
    if (btn) btn.textContent = document.fullscreenElement ? '✕ Sair' : '⛶';
  });

  // ── Painel de filtros ─────────────────────────────────────────
  function toggleFiltros() {
    const panel = document.getElementById('filter-panel');
    panel.classList.toggle('open');
  }

  function aplicarFiltros() {
    filtros.dataIni   = document.getElementById('f-data-ini')?.value || '';
    filtros.dataFim   = document.getElementById('f-data-fim')?.value || '';
    filtros.motorista = (document.getElementById('f-motorista')?.value || '').trim().toLowerCase();
    filtros.usina     = (document.getElementById('f-usina')?.value || '').trim().toLowerCase();

    renderListaFiltrada();
    atualizarChipsFiltro();
    atualizarBadgeFiltro();

    // Fechar painel após aplicar
    document.getElementById('filter-panel').classList.remove('open');
  }

  function limparFiltros() {
    filtros = { dataIni:'', dataFim:'', motorista:'', usina:'' };
    ['f-data-ini','f-data-fim','f-motorista','f-usina'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    renderListaFiltrada();
    atualizarChipsFiltro();
    atualizarBadgeFiltro();
  }

  function removerFiltro(campo) {
    filtros[campo] = '';
    const el = { dataIni:'f-data-ini', dataFim:'f-data-fim', motorista:'f-motorista', usina:'f-usina' }[campo];
    if (el) { const inp = document.getElementById(el); if (inp) inp.value = ''; }
    renderListaFiltrada();
    atualizarChipsFiltro();
    atualizarBadgeFiltro();
  }

  function filtrarLista(lista) {
    return lista.filter(r => {
      if (filtros.motorista && !(r.motorista||'').toLowerCase().includes(filtros.motorista)) return false;
      if (filtros.usina && !(r.destinos||[]).some(d => (d.usina||'').toLowerCase().includes(filtros.usina))) return false;
      if (filtros.dataIni || filtros.dataFim) {
        // dataEmbarque formato dd/mm/yyyy
        const partes = (r.dataEmbarque||'').split('/');
        if (partes.length === 3) {
          const dataISO = partes[2] + '-' + partes[1] + '-' + partes[0];
          if (filtros.dataIni && dataISO < filtros.dataIni) return false;
          if (filtros.dataFim && dataISO > filtros.dataFim) return false;
        }
      }
      return true;
    });
  }

  function renderListaFiltrada() {
    const filtrada = filtrarLista(listaCompleta);
    const count = document.getElementById('filter-count');
    if (count) count.textContent = filtrada.length + ' de ' + listaCompleta.length + ' romaneios';
    renderLista(filtrada, true);
  }

  function atualizarChipsFiltro() {
    const container = document.getElementById('active-filters');
    if (!container) return;
    const chips = [];
    const fmt = { dataIni:'A partir de', dataFim:'Até', motorista:'Motorista', usina:'Usina' };
    const fmtVal = { dataIni: v => v.split('-').reverse().join('/'), dataFim: v => v.split('-').reverse().join('/'), motorista: v => v, usina: v => v };
    for (const [k, v] of Object.entries(filtros)) {
      if (!v) continue;
      chips.push(`<span class="filter-chip">${fmt[k]}: ${fmtVal[k](v)}<button onclick="removerFiltro('${k}')" title="Remover">✕</button></span>`);
    }
    container.innerHTML = chips.join('');
  }

  function atualizarBadgeFiltro() {
    const badge = document.getElementById('filtros-badge');
    if (!badge) return;
    const count = Object.values(filtros).filter(Boolean).length;
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline' : 'none';
  }

  // ── Atualizar stats bar ───────────────────────────────────────
  function atualizarStats(lista) {
    const totalNotas = lista.reduce((s, r) => s + (r.totalNotas || 0), 0);
    const totalVols  = lista.reduce((s, r) =>
      s + (r.destinos||[]).reduce((sv, d) =>
        sv + (d.notas||[]).reduce((svv, n) => svv + (n.volumes||1), 0), 0), 0);
    const totalDest  = lista.reduce((s, r) => s + (r.destinos||[]).length, 0);
    const el = id => document.getElementById(id);
    if (el('stat-total')) el('stat-total').textContent = lista.length;
    if (el('stat-notas')) el('stat-notas').textContent = totalNotas;
    if (el('stat-vols'))  el('stat-vols').textContent  = totalVols;
    if (el('stat-dest'))  el('stat-dest').textContent  = totalDest;
  }

  function atualizarClock() {
    document.getElementById('clock').textContent = new Date()
      .toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }

  // ══════════════════════════════════════════════════════════
  // POLLING — Firebase Realtime Database
  // ══════════════════════════════════════════════════════════
  async function buscar() {
    try {
      // Pega os últimos 40 romaneios ordenados pela chave Firebase
      const r    = await fetch(`${DB_URL}/romaneios.json?orderBy="$key"&limitToLast=40`);
      const json = await r.json();
      setStatus(true);

      // Firebase retorna objeto { pushId: {dados}, … } — converte para array
      const romaneios = json
        ? Object.entries(json)
            .map(([key, r]) => ({
              ...r,
              _fbKey: key,   // chave Firebase — necessária para editar/salvar
              destinos: typeof r.destinos === 'string'
                ? (() => { try { return JSON.parse(r.destinos); } catch(_){ return []; } })()
                : (r.destinos || [])
            }))
            .sort((a, b) => Number(b.numero) - Number(a.numero))
        : [];

      listaCompleta = romaneios;
      const filtrada = filtrarLista(romaneios);
      renderLista(filtrada, Object.values(filtros).some(Boolean));
    } catch (_) {
      setStatus(false);
    }
  }

  function setStatus(ok) {
    document.getElementById('status-txt').textContent   = ok ? 'Ao vivo' : 'Sem conexão…';
    document.getElementById('pulse-dot').style.background = ok ? '#4ADE80' : '#F87171';
    document.getElementById('upd').textContent = 'Atualizado às ' +
      new Date().toLocaleTimeString('pt-BR');
  }

  function renderLista(lista) {
    const el = document.getElementById('lista');

    if (!lista.length) {
      el.innerHTML = `<div class="empty">
        <div class="empty-ico">📋</div>
        <h3>Nenhum romaneio ainda</h3>
        <p>Quando o operador enviar um romaneio, ele aparecerá aqui.</p>
      </div>`;
      primeiraVez = false;
      return;
    }

    const maisRec = lista[0];
    const isNovo  = !primeiraVez && ultimoNum !== null && maisRec.numero !== ultimoNum;

    if (isNovo) {
      mostrarToast(`📋 Novo romaneio Nº ${maisRec.numero} — ${maisRec.motorista}`);
      beep();
    }

    ultimoNum   = maisRec.numero;
    primeiraVez = false;

    romaneiosList = lista;
    el.innerHTML = lista.map((r, i) => cardHTML(r, i, i === 0 && isNovo)).join('');
  }

        } vol · ${destinos.length} destino${destinos.length!==1?'s':''}</div>

  function formatarChave(ch) {

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 5500);
  }

  function beep() {
    try {
      const ctx  = new AudioContext();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + .1);
      gain.gain.setValueAtTime(.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .35);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + .35);
    } catch (_) {}
  }

  let editState = null;

  // ── Abrir modal ─────────────────────────────────────────────
  function abrirEditar(idx) {
    const r = romaneiosList[parseInt(idx, 10)];
    if (!r) { alert('Romaneio não encontrado. Aguarde a próxima atualização e tente novamente.'); return; }
    editState = JSON.parse(JSON.stringify(r)); // deep copy
    renderModalEditar();
    document.getElementById('modal-editar').style.display = 'flex';

  function fecharEditar() {
    document.getElementById('modal-editar').style.display = 'none';
    editState = null;
  }

  // ── Renderizar campos do modal ───────────────────────────────
  function renderModalEditar() {
    if (!editState) return;
    const r = editState;

    document.getElementById('ed-numero').textContent = 'Romaneio Nº ' + r.numero;
    document.getElementById('ed-data').value =
      r.dataEmbarque ? r.dataEmbarque.split('/').reverse().join('-') : '';
    document.getElementById('ed-motorista').value = r.motorista || '';
    document.getElementById('ed-msg').textContent  = '';
    document.getElementById('ed-msg').style.color  = '#555';

            onchange="editSetVolumes(${di},${ni},this.value)"

        <div class="ed-dest">
          <div class="ed-dest-hdr">

  // ── Operações nos destinos ───────────────────────────────────
  function editSetUsina(di, val) {
    if (editState) editState.destinos[di].usina = val;
  }

  function editRemDest(di) {
    if (!editState) return;
    if (editState.destinos.length <= 1) {
      setEdMsg('É necessário ter ao menos um destino.', 'erro'); return;
    }
    editState.destinos.splice(di, 1);
    renderModalEditar();
  }

  function editAddDest() {
    if (!editState) return;
    editState.destinos.push({ usina: '', notas: [] });
    renderModalEditar();
    setTimeout(() => {
      const dests = document.querySelectorAll('.ed-dest');
      dests[dests.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  function editAddNota(di) {
    if (!editState) return;
    const inp   = document.getElementById('ed-inp-' + di);
    const valor = inp.value.trim();
    if (!valor) return;

    const s = valor.replace(/\D/g, '');
    let nf;
    if (s.length === 44) {
      const num = parseInt(s.substring(25, 34), 10);
      nf = { chave: s, display: 'NF ' + num.toLocaleString('pt-BR'), volumes: 1 };
    } else if (s.length >= 1 && s.length <= 9) {
      nf = { chave: s, display: 'NF ' + parseInt(s, 10).toLocaleString('pt-BR'), volumes: 1 };
    } else {
      setEdMsg('NF inválida. Use o número curto ou a chave de 44 dígitos.', 'erro'); return;
    }

    const jaExiste = editState.destinos.some(d => d.notas.some(n => n.chave === nf.chave));
    if (jaExiste) { setEdMsg('Essa nota já está em outro destino.', 'erro'); return; }

    const volInp = document.getElementById('ed-vol-' + di);
    nf.volumes = Math.max(1, parseInt(volInp ? volInp.value : 1, 10) || 1);
    editState.destinos[di].notas.push(nf);
    inp.value = '';
    if (volInp) volInp.value = '1';
    setEdMsg('', '');
    renderModalEditar();
  }

  function editRemNota(di, ni) {
    if (!editState) return;
    editState.destinos[di].notas.splice(ni, 1);
    renderModalEditar();
  }

  function editSetVolumes(di, ni, val) {
    if (!editState) return;
    editState.destinos[di].notas[ni].volumes = Math.max(1, parseInt(val, 10) || 1);
  }

  // ── Salvar ───────────────────────────────────────────────────
  async function salvarEdicao() {
    if (!editState) return;
    const msg = document.getElementById('ed-msg');

    const dataRaw   = document.getElementById('ed-data').value;
    const motorista = document.getElementById('ed-motorista').value.trim();

    if (!dataRaw)   { setEdMsg('Informe a data do embarque.', 'erro'); return; }
    if (!motorista) { setEdMsg('Informe o motorista.', 'erro'); return; }

    const destinosValidos = editState.destinos.filter(d => d.usina);
    if (!destinosValidos.length) { setEdMsg('Informe ao menos um destino com usina.', 'erro'); return; }

    const [a, m, d] = dataRaw.split('-');
    const dataFmt   = d + '/' + m + '/' + a;
    const totalNotas = destinosValidos.reduce((s, d) => s + d.notas.length, 0);

    const payload = {
      numero:        editState.numero,
      dataHoraEnvio: editState.dataHoraEnvio,
      dataEmbarque:  dataFmt,
      motorista,
      destinos:      JSON.stringify(destinosValidos),
      totalNotas
    };

    const btn = document.getElementById('ed-btn-salvar');
    btn.disabled = true; btn.textContent = 'Salvando…';

    try {
      const resp = await fetch(DB_URL + '/romaneios/' + editState._fbKey + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error('Firebase ' + resp.status);
      setEdMsg('✓ Alterações salvas!', 'ok');
      setTimeout(fecharEditar, 1000);
    } catch (e) {
      setEdMsg('Erro ao salvar: ' + e.message, 'erro');
    } finally {
      btn.disabled = false; btn.textContent = 'Salvar alterações';
    }
  }

  // ── Excluir romaneio inteiro ─────────────────────────────────
  async function excluirRomaneio() {
    if (!editState) return;

    const confirmado = confirm(
      'Tem certeza que deseja EXCLUIR o Romaneio Nº ' + editState.numero + '?\n\n' +
      'Esta ação não pode ser desfeita.'
    );
    if (!confirmado) return;

    const btn = document.getElementById('ed-btn-excluir');
    btn.disabled = true; btn.textContent = 'Excluindo…';

    try {
      const resp = await fetch(DB_URL + '/romaneios/' + editState._fbKey + '.json', {
        method: 'DELETE'
      });
      if (!resp.ok) throw new Error('Firebase ' + resp.status);
      fecharEditar();
      mostrarToast('🗑️ Romaneio Nº ' + editState?.numero + ' excluído.');
    } catch (e) {
      setEdMsg('Erro ao excluir: ' + e.message, 'erro');
      btn.disabled = false; btn.textContent = '🗑️ Excluir romaneio';
    }
  }

  // ── Helper mensagem ──────────────────────────────────────────
  function setEdMsg(texto, tipo) {
    const el = document.getElementById('ed-msg');
    if (!el) return;
    el.textContent = texto;
    el.style.color = tipo === 'erro' ? '#dc2626' : tipo === 'ok' ? '#1B6B3A' : '#555';
  }

</script>
